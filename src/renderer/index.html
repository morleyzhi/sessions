<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>Sessions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <nav class="mode-tabs" aria-label="View">
        <button id="sessions-tab" aria-pressed="true">Sessions</button>
        <button id="timeline-tab" aria-pressed="false">Timeline</button>
      </nav>
    </header>
    <main id="sessions-view">
      <aside class="sidebar">
        <div class="search">
          <input id="query" type="search" placeholder="Search sessions" autofocus spellcheck="false" />
        </div>
        <div class="filters" id="filters">
          <button class="filter active" data-tool="all"><span class="dot all"></span>All</button>
          <button class="filter" data-tool="claude"><span class="dot claude"></span>Claude</button>
          <button class="filter" data-tool="codex"><span class="dot codex"></span>Codex</button>
          <button class="filter" data-tool="cursor"><span class="dot cursor"></span>Cursor</button>
        </div>
        <ul class="list pinned-list" id="pinned"></ul>
        <ul class="list" id="list"></ul>
      </aside>
      <section class="detail" id="detail">
        <div class="empty">Select a session</div>
      </section>
    </main>
    <section id="timeline-view" hidden aria-label="Work timeline">
      <div class="timeline-toolbar">
        <div><strong>Work timeline</strong><span id="timeline-status">Loading…</span></div>
        <div class="timeline-controls">
          <label>Zoom <select id="timeline-zoom" title="Cmd+plus to zoom in; Cmd+minus to zoom out">
            <option value="15">15 min / screen</option>
            <option value="30">30 min / screen</option>
            <option value="60" selected>1 hour / screen</option>
            <option value="120">2 hours / screen</option>
            <option value="240">4 hours / screen</option>
          </select></label>
          <label>Jump to <input id="timeline-date" type="date" /></label>
          <button id="timeline-now">Now ↑</button>
        </div>
      </div>
      <div class="timeline-note">Newest first · Exact prompt times · Shading infers activity through the last reply (silences over 30m excluded) · PR labels come from agent mentions</div>
      <div id="timeline-scroll" tabindex="0" aria-label="Scroll backward through your work">
        <div id="timeline-head"></div>
        <div id="timeline-canvas"></div>
        <div id="timeline-probe" hidden></div>
      </div>
    </section>
    <script src="renderer.js"></script>
    <script src="timeline.js"></script>
  </body>
</html>
